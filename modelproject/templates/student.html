
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            align-items: center;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        .table-h {
            color: red;
        }

        caption {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <table>
        <caption>Student Database</caption>

        <thead >
            <tr class="table-h">
                <th>Name</th>
                <th>Branch</th>
                <th>Age</th>
                <th>Place</th>
                <th>Phone</th>
                <th>DOB</th>
                <th>Email</th>
            </tr>

           {% for i in stud %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.branch }}</td>
                <td>{{ i.age }}</td>
                <td>{{ i.place }}</td>
                <td>{{ i.phone }}</td>
                <td>{{ i.dob }}</td>
                <td>{{ i.email }}</td>
            </tr>
            {% endfor %}
                
        </thead>
    </table>

</body>
</html>
