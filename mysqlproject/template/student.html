<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student details</h1>
    
    <h1>Product Details</h1>

    <div class="container">

            <div class="card-content">

            </div>
    </div>
    {% endfor %}
</body>
</html>
